<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AquaSentinel</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-bg">
        <a href="index.html" style="position: absolute; top: 30px; left: 30px; color: white; text-decoration: none; font-weight: 700; z-index: 10; display: flex; align-items: center; gap: 10px;">
            <i class="fa-solid fa-arrow-left"></i> Back to Home
        </a>
        
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 30px;">
                <div style="width: 70px; height: 70px; background: var(--primary); border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 2rem; color: white; box-shadow: 0 10px 20px rgba(0, 150, 136, 0.4);">
                    <i class="fa-solid fa-water"></i>
                </div>
                <h2 style="font-size: 2rem; font-weight: 700; color: #1f2937;">Welcome Back</h2>
                <p style="color: #6b7280;">Login to your dashboard</p>
            </div>
            
            <form id="login-form">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="login-email" required placeholder="ranger@ocean.org">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="login-password" required placeholder="••••••••">
                </div>
                
                <div id="login-error" style="color: #ef4444; font-size: 0.9rem; margin-bottom: 15px; display: none; text-align: center;">
                    <i class="fa-solid fa-circle-exclamation"></i> Incorrect credentials
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">LOGIN</button>
            </form>
            
            <div style="margin-top: 25px; text-align: center; font-size: 0.9rem; color: #6b7280;">
                Don't have an account? 
                <a href="signup.html" style="color: var(--primary); font-weight: 700; text-decoration: none;">Sign Up</a>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
